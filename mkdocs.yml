# ==============================================================================
# PROJECT INFORMATION
# ==============================================================================
site_name: Пишем Telegram-ботов с aiogram 3.x
site_description: Учебник по разработке ботов для Telegram на языке Python при помощи фреймворка aiogram 3.x
site_author: MasterGroosha, Translated by VAI
site_url: https://mastergroosha.github.io/aiogram-3-guide
docs_dir: book_src
site_dir: docs

# ==============================================================================
# REPOSITORY SETTINGS
# ==============================================================================
repo_name: MasterGroosha/aiogram-3-guide
repo_url: https://github.com/MasterGroosha/aiogram-3-guide
edit_uri: blob/main/book_src/

# ==============================================================================
# COPYRIGHT
# ==============================================================================
copyright: Original Copyright &copy; 2020-2026 Groosha, Translation Copyright &copy; 2024-2026 VAI

# ==============================================================================
# THEME CONFIGURATION
# ==============================================================================
theme:
  name: material
  custom_dir: book_src/overrides
  language: ru
  
  # Color palette for light/dark theme
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Включить тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Включить светлую тему
  
  # Font configuration
  font:
    text: Roboto
    code: Roboto Mono
  
  # Icon configuration
  icon:
    logo: material/robot
  
  # Feature flags
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy

# ==============================================================================
# EXTRA CONFIGURATION
# ==============================================================================
extra:
