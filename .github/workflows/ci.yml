name: ci

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5.1.0
        with:
          python-version: 3.x

      - name: Install documentation dependencies
        run: pip install -r requirements.txt

      - name: Build strict production site
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pages_owner="${REPOSITORY%%/*}"
          pages_owner="$(printf '%s' "$pages_owner" | tr '[:upper:]' '[:lower:]')"
          repo_slug="${REPOSITORY##*/}"
          mkdocs build --strict \
            --site-dir site \
            --site-url "https://${pages_owner}.github.io/${repo_slug}/"

      - name: Publish production site and preserve previews
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          keep_files: true
          commit_message: 'deploy production site from master'
